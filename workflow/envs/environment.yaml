name: ampair
# Legacy micromamba/conda fallback. Keep this file in sync with the default
# Pixi environment; `pixi run metadata-check` enforces the mirrored fields.
channels:
  - conda-forge
  - bioconda
dependencies:
  # pipeline runner
  - snakemake-minimal>=8

  # cross-platform Python workflow implementation
  - python=3.12
  - biopython
  - numpy
  - matplotlib-base
  - pyyaml

  # genome download
  - ncbi-genome-download

  # reporting
  - markdown

  # VSEARCH, MUSCLE, and SeqKit are selected on Unix platforms. Windows installs them
  # through Scoop when the workflow runs.
  - vsearch  # [unix]
  - muscle  # [unix]
  - seqkit  # [unix]

  # development checks
  - ruff
  - ty
