[project]
name = "ampair"
version = "0.1.0"
description = "Amplicon-sequencing primer design workflow for bacterial genera"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "AmPair contributors" },
]
# Runtime dependencies are declared in pixi.toml because AmPair is distributed
# as a Pixi-built conda package. Keep this wheel metadata minimal to avoid a
# second dependency source of truth with PyPI-only package names.

[project.urls]
Homepage = "https://github.com/Xinming9606/AmPair"
Issues = "https://github.com/Xinming9606/AmPair/issues"
Repository = "https://github.com/Xinming9606/AmPair"

[project.scripts]
ampair = "ampair.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ampair"]

[tool.hatch.build.targets.wheel.force-include]
config = "ampair/config"
workflow = "ampair/workflow"
Snakefile = "ampair/Snakefile"

[tool.ty]
# Workflow scripts and tools import sibling modules (e.g. config_schema.py,
# _shared.py) as top-level imports, so their directories are extra paths.

[tool.ty.src]
include = [
  "ampair",
  "tools",
  "workflow/scripts",
]
exclude = [
  ".pixi",
  ".snakemake",
  "dist",
  "results",
]

[tool.ty.environment]
# Pixi environments are not discovered automatically (they set CONDA_PREFIX,
# not VIRTUAL_ENV), so point ty at the default environment explicitly.
python = ".pixi/envs/default"
extra-paths = [
  "workflow/scripts",
  "tools",
]
python-version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".git",
  ".pixi",
  ".snakemake",
  "dist",
  "results",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings
docstring-code-format = true
# Format all docstring code snippets with a line length of 60
docstring-code-line-length = 60

skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ISC", "SIM", "DTZ", "TID"]

[tool.ruff.lint.per-file-ignores]
"workflow/scripts/*.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
detect-same-package = false
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true
