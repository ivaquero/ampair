name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Compile and smoke test
    runs-on: ${{ matrix.os }}
    env:
      # Keep release checks on the same explicit reference snapshot as CI.
      TEST_DATASET_VERSION: borrelia-complete-v1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true

      - name: Cache CI test dataset
        id: test-data-cache
        uses: actions/cache@v6
        with:
          path: |
            test_data/borrelia-genomes.tar.gz
            test_data/borrelia-genomes.tar.gz.json
          key: ampair-borrelia-genomes-${{ runner.os }}-${{ env.TEST_DATASET_VERSION }}-${{ hashFiles('pixi.lock', 'config/config.yaml', 'workflow/Snakefile', 'tools/download_test_dataset.py', 'tools/verify_test_dataset.py', 'workflow/scripts/genomes_download.py', 'workflow/scripts/gene_extract.py', 'workflow/scripts/common.py') }}

      - name: Prepare Scoop on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          $scoopShims = Join-Path $env:USERPROFILE 'scoop\shims'
          if (-not (Test-Path $scoopShims)) {
            throw "Scoop shims directory was not created: $scoopShims"
          }
          $env:PATH = "$scoopShims;$env:PATH"
          $scoopShims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Load Scoop bucket on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bucketOutput = scoop bucket list | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop bucket listing failed with exit code $LASTEXITCODE"
          }
          if ($bucketOutput -notmatch '(?m)^\s*main-plus(\s|$)') {
            scoop bucket add main-plus https://github.com/Scoopforge/Main-Plus
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop main-plus bucket could not be added"
            }
          }

      - name: Check and install external dependencies
        run: pixi run ensure-dependencies

      - name: Download CI test dataset
        if: steps.test-data-cache.outputs.cache-hit != 'true'
        run: pixi run download-ci-test-data

      - name: Run project checks
        run: pixi run ci

  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true

      - name: Build source archives
        run: pixi run source-archive

      - name: Build conda package
        run: pixi run conda-build

      - name: Test built package install
        run: pixi run conda-install-test

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ampair-release-artifacts
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/conda/*.conda

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip
          dist/*.tar.gz
          dist/conda/*.conda
          --generate-notes
          --verify-tag
