# =============================================================================
# AmPair configuration
#
# Edit this file before running the pipeline. Each gene is processed
# independently and gets its own HTML report.
#
# NOTE (primer-diff comparison):
# The values below are aligned with the first-version ("original") pipeline so
# that the two code bases can be compared on the SAME inputs. The original
# reference run used:
#   genus: Borrelia
#   genes: [recG]
#   pcr_top_n -> the original R design/validation path kept the top 50 pairs
#               (pcr_top_n was not configurable there; 50 is used here to match)
# Everything else (primer_len, amplicon range, div_cut, GC_tol, pcr_mismatch,
# max_degeneracy) already matches the original defaults. The two extra keys
# min_allele_freq / max_degeneracy are also present in the original design step,
# so they are kept at the original-equivalent values.
# =============================================================================

# -----------------------------------------------------------------------------
# Required: target organism and genes
# -----------------------------------------------------------------------------

# Bacterial genus name, exactly as recognized by NCBI.
# Examples: Bacillus, Pseudomonas, Listeria, Streptomyces
genus: Borrelia

# One or more housekeeping gene names.
genes:
  - recG

# Optional alternative names for each gene, searched in addition to the primary
# gene name. Useful when annotations vary across genomes.
#
# Example:
# gene_aliases:
#   tuf:
#     - tsf
#   16S:
#     - "16S ribosomal RNA"
gene_aliases: {}

# -----------------------------------------------------------------------------
# Genome download
# -----------------------------------------------------------------------------

# ncbi-genome-download assembly level filter.
# Options: complete, chromosome, scaffold, contig
# "complete" is recommended for reliable gene extraction.
assembly_level: complete

# -----------------------------------------------------------------------------
# Primer design parameters
# -----------------------------------------------------------------------------

# Primer length in bp.
primer_len: 20

# Amplicon size range in bp. This is the distance between forward and reverse
# primer start positions in the alignment.
amplicon_min_len: 300
amplicon_max_len: 1000

# Shannon entropy cutoff for a primer window to be considered conserved.
# Lower is more stringent. If no primers are found, raise this value.
div_cut: 2.0

# Optional per-gene diversity cutoff overrides.
#
# Example:
# div_cut_per_gene:
#   16S: 3.0
#   rpoB: 1.5
div_cut_per_gene: {}

# Maximum allowed GC fraction difference between forward and reverse primers.
GC_tol: 0.1

# Minimum allele frequency for a base to be included in the degenerate IUPAC
# primer code. Lower values allow more degenerate positions. 0.05 matches the
# original (first-version) pipeline default; using 0.0 makes every minor base
# degenerate and produces a very different (more degenerate) primer set.
min_allele_freq: 0.05

# Maximum allowed degeneracy fold per primer. A fold of 16 means, for example,
# up to four degenerate 2-way positions or two degenerate 4-way positions.
max_degeneracy: 16

# -----------------------------------------------------------------------------
# Primer quality filters
# -----------------------------------------------------------------------------

# Hairpin, dimer, and 3'-end stability thresholds in kcal/mol.
# Pairs where any dG is lower than the threshold are dropped.
# More negative dG means stronger secondary structure, which is worse.
# Set all thresholds to -99 to effectively disable filtering.
max_hairpin_dg: 0.0
max_homodimer_dg: -6.0
max_heterodimer_dg: -6.0
max_3end_dg: -8.0

# -----------------------------------------------------------------------------
# In silico PCR validation
# -----------------------------------------------------------------------------

# Mismatches allowed per primer during SeqKit in silico PCR. For a 20 bp
# primer, 3 mismatches is about 15% tolerance and is useful for cross-species
# amplification.
pcr_mismatch: 3

# Number of QC-passed primer pairs to validate against full genomes. The report
# recommends the best pair after this validation, not just the original top hit.
# Set to 50 to match the original (first-version) pipeline, which validated the
# top 50 candidates before recommending.
pcr_top_n: 50

# Upper bound for retained primer pairs after scoring. Keeping this bounded
# prevents a permissive design from materializing an impractically large TSV.
max_primer_pairs: 100000
